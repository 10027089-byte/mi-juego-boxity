name: Conectar y Desplegar en Boxity
on:
  push:
    branches: [ "main", "dev" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and push to Boxity
        env:
          BOXITY_GIT_URL: ${{ secrets.BOXITY_GIT_URL }}
        run: |
          npm install
          npm run build
          if [[ "$BOXITY_GIT_URL" == https://boxity:*@mcp.bloxity.io/git/roba-un-brainrot.git ]]; then
            PUSH_URL="$BOXITY_GIT_URL"
          else
            PUSH_URL="https://boxity:${BOXITY_GIT_URL}@mcp.bloxity.io/git/roba-un-brainrot.git"
          fi
          git push --force "$PUSH_URL" HEAD:dev
