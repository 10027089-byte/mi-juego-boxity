name: Conectar y Desplegar en Boxity
on:
  push:
    branches: [ "main", "dev" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          npm install
          npm run build
          H="mcp.bloxity.io"
          git push --force "https://boxity:${{ secrets.BOXITY_GIT_URL }}@${H}/git/roba-un-brainrot.git" HEAD:dev
